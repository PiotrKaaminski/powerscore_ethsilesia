services:
  db:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-powerscore}
      POSTGRES_USER: ${DB_USERNAME:-powerscore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-powerscore}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-powerscore}
      DB_USERNAME: ${DB_USERNAME:-powerscore}
      DB_PASSWORD: ${DB_PASSWORD:-powerscore}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      KONTOMATIC_API_KEY: ${KONTOMATIC_API_KEY}
      KONTOMATIC_DATA_SINCE: ${KONTOMATIC_DATA_SINCE}
    depends_on:
      db:
        condition: service_healthy
